<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FuelTrack - Gestion des pleins</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%230f766e' width='192' height='192' rx='24'/%3E%3Ctext x='96' y='130' font-size='110' text-anchor='middle' fill='white'%3E⛽%3C/text%3E%3C/svg%3E">
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>
    <style>
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --primary-dark: #115e59;
            --bg: #f0fdfa;
            --surface: #ffffff;
            --text: #134e4a;
            --text-secondary: #5eead4;
            --border: #ccfbf1;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #042f2e;
                --surface: #115e59;
                --text: #f0fdfa;
                --text-secondary: #5eead4;
                --border: #134e4a;
                --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
                --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1.2rem 1rem 2.5rem;
            position: relative;
            box-shadow: var(--shadow-lg);
        }
        .app-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        .app-header p { opacity: 0.9; font-size: 0.875rem; margin-top: 0.25rem; }
        .nav-tabs {
            display: flex;
            background: var(--surface);
            margin: -1.5rem 1rem 0;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
            overflow: hidden;
        }
        .nav-tab {
            flex: 1;
            padding: 1rem 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-secondary);
            transition: all 0.3s;
            position: relative;
        }
        .nav-tab.active { color: var(--primary); }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }
        .content {
            flex: 1;
            padding: 1.5rem 1rem;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .form-input, .form-select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary-light);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 14px rgba(15, 118, 110, 0.3);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.875rem; width: auto; }

        .photo-area {
            border: 3px dashed var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        .photo-area:hover { border-color: var(--primary-light); }
        .photo-area.has-image {
            border-style: solid;
            border-color: var(--primary-light);
            padding: 0;
        }
        .photo-area img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; display: block; }
        .photo-placeholder { font-size: 3rem; margin-bottom: 0.5rem; }
        .photo-text { font-size: 0.875rem; color: var(--text-secondary); }
        .photo-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 0.875rem; color: var(--text-secondary); }
        .info-value { font-weight: 600; font-size: 0.9375rem; }

        .vehicle-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin: 0.25rem;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .vehicle-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .fill-item {
            background: var(--surface);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .fill-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg);
            cursor: pointer;
        }
        .fill-info { flex: 1; min-width: 0; }
        .fill-vehicle { font-weight: 700; font-size: 0.9375rem; }
        .fill-meta { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem; line-height: 1.5; }
        .fill-address { font-size: 0.75rem; color: var(--primary-light); margin-top: 0.25rem; }
        .fill-actions { display: flex; flex-direction: column; gap: 0.4rem; }
        .fill-amount { text-align: right; }
        .fill-price { font-weight: 700; font-size: 1.125rem; color: var(--primary); }
        .fill-volume { font-size: 0.75rem; color: var(--text-secondary); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .stat-box {
            background: var(--bg);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem; text-transform: uppercase; }

        .chart-container {
            position: relative;
            height: 250px;
            margin: 1rem 0;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: 20px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .modal-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; }
        .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
        .modal-actions .btn { flex: 1; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }

        .ocr-status {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            text-align: center;
            display: none;
        }
        .ocr-status.loading { display: block; background: #dbeafe; color: #1e40af; }
        .ocr-status.success { display: block; background: #dcfce7; color: #166534; }
        .ocr-status.error { display: block; background: #fee2e2; color: #991b1b; }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .period-selector {
            display: flex;
            background: var(--bg);
            border-radius: 10px;
            padding: 0.25rem;
            margin-bottom: 1rem;
        }
        .period-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            background: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .period-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--bg);
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            box-shadow: var(--shadow-lg);
            z-index: 200;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .install-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .install-banner.show { display: flex; }

        .loc-status {
            font-size: 0.75rem;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
        }
        .loc-status.loading { display: inline-block; background: #dbeafe; color: #1e40af; }
        .loc-status.success { display: inline-block; background: #dcfce7; color: #166534; }
        .loc-status.error { display: inline-block; background: #fee2e2; color: #991b1b; }

        @media (min-width: 640px) {
            .content { padding: 2rem; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>⛽ FuelTrack</h1>
        <p>Suivez vos pleins de carburant</p>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="showView('add')">📝 Nouveau</button>
        <button class="nav-tab" onclick="showView('history')">📋 Historique</button>
        <button class="nav-tab" onclick="showView('stats')">📊 Stats</button>
        <button class="nav-tab" onclick="showView('vehicles')">🚗 Véhicules</button>
    </div>

    <div class="content">
        <!-- Install Banner -->
        <div class="install-banner" id="installBanner">
            <div>
                <div style="font-weight:700">Installer l'application</div>
                <div style="font-size:0.875rem;opacity:0.9">Accès rapide depuis l'écran d'accueil</div>
            </div>
            <button class="btn btn-sm" style="background:white;color:var(--primary);white-space:nowrap" onclick="installApp()">Installer</button>
        </div>

        <!-- VIEW: ADD FILL -->
        <div class="view active" id="view-add">
            <div class="card">
                <div class="card-title">📸 Photo du compteur</div>
                <div class="photo-area" id="photoArea" onclick="document.getElementById('photoInput').click()">
                    <div class="photo-placeholder">📷</div>
                    <div class="photo-text">Appuyez pour prendre une photo</div>
                    <input type="file" id="photoInput" class="photo-input" accept="image/*" capture="environment" onchange="handlePhoto(event)">
                </div>
                <div class="ocr-status" id="ocrStatus"></div>
            </div>

            <div class="card">
                <div class="card-title">🚗 Véhicule</div>
                <div id="vehicleSelector" class="filter-bar"></div>
                <button class="btn btn-secondary btn-sm" onclick="openVehicleModal()" style="width:auto">+ Ajouter un véhicule</button>
            </div>

            <div class="card">
                <div class="card-title">📍 Informations automatiques</div>
                <div class="info-row">
                    <span class="info-label">📅 Date & Heure</span>
                    <span class="info-value" id="autoDate">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📍 Localisation</span>
                    <span class="info-value" id="autoLocation">-</span>
                </div>
                <div id="addressDisplay" class="fill-address" style="display:none;margin-top:0.25rem"></div>
                <div style="margin-top:0.5rem">
                    <button class="btn btn-secondary btn-sm" onclick="refreshLocation()" style="width:auto">🔄 Actualiser la position</button>
                    <span class="loc-status" id="locStatus"></span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">⛽ Détails du plein</div>
                <div class="form-group">
                    <label class="form-label">Volume (litres)</label>
                    <input type="number" id="volumeInput" class="form-input" step="0.01" placeholder="Ex: 45.32">
                </div>
                <div class="form-group">
                    <label class="form-label">Prix au litre (€)</label>
                    <input type="number" id="priceInput" class="form-input" step="0.001" placeholder="Ex: 1.789">
                </div>
                <div class="form-group">
                    <label class="form-label">Prix total (€) <span style="font-weight:400;color:var(--text-secondary)">- auto</span></label>
                    <input type="number" id="totalInput" class="form-input" step="0.01" placeholder="Calculé automatiquement">
                </div>
                <div class="form-group">
                    <label class="form-label">Kilométrage (km)</label>
                    <input type="number" id="kmInput" class="form-input" step="1" placeholder="Kilométrage au compteur">
                </div>
            </div>

            <button class="btn btn-primary" onclick="saveFill()" id="saveBtn">
                💾 Enregistrer le plein
            </button>
        </div>

        <!-- VIEW: HISTORY -->
        <div class="view" id="view-history">
            <div class="filter-bar" id="historyFilter"></div>
            <div id="historyList"></div>
        </div>

        <!-- VIEW: STATS -->
        <div class="view" id="view-stats">
            <div class="filter-bar" id="statsFilter"></div>

            <div class="period-selector">
                <button class="period-btn active" onclick="setPeriod('month')">Mensuel</button>
                <button class="period-btn" onclick="setPeriod('year')">Annuel</button>
            </div>

            <div id="statsContent"></div>
        </div>

        <!-- VIEW: VEHICLES -->
        <div class="view" id="view-vehicles">
            <div id="vehiclesList"></div>
            <button class="btn btn-primary" onclick="openVehicleModal()">+ Ajouter un véhicule</button>
        </div>
    </div>

    <!-- MODAL: Vehicle -->
    <div class="modal-overlay" id="vehicleModal">
        <div class="modal">
            <div class="modal-header">🚗 Véhicule</div>
            <div class="form-group">
                <label class="form-label">Nom du véhicule</label>
                <input type="text" id="vehicleName" class="form-input" placeholder="Ex: Peugeot 208">
            </div>
            <div class="form-group">
                <label class="form-label">Immatriculation</label>
                <input type="text" id="vehiclePlate" class="form-input" placeholder="Ex: AB-123-CD">
            </div>
            <div class="form-group">
                <label class="form-label">Type de carburant</label>
                <select id="vehicleFuel" class="form-select">
                    <option value="SP95">SP95</option>
                    <option value="SP98">SP98</option>
                    <option value="E10">E10</option>
                    <option value="Diesel">Diesel</option>
                    <option value="GPL">GPL</option>
                    <option value="Électrique">Électrique</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeVehicleModal()">Annuler</button>
                <button class="btn btn-primary" onclick="saveVehicle()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Edit Fill -->
    <div class="modal-overlay" id="fillModal">
        <div class="modal">
            <div class="modal-header">✏️ Modifier le plein</div>
            <div class="form-group">
                <label class="form-label">Véhicule</label>
                <select id="editFillVehicle" class="form-select"></select>
            </div>
            <div class="form-group">
                <label class="form-label">Date & Heure</label>
                <input type="datetime-local" id="editFillDate" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Volume (litres)</label>
                <input type="number" id="editFillVolume" class="form-input" step="0.01">
            </div>
            <div class="form-group">
                <label class="form-label">Prix au litre (€)</label>
                <input type="number" id="editFillPrice" class="form-input" step="0.001">
            </div>
            <div class="form-group">
                <label class="form-label">Prix total (€)</label>
                <input type="number" id="editFillTotal" class="form-input" step="0.01">
            </div>
            <div class="form-group">
                <label class="form-label">Kilométrage (km)</label>
                <input type="number" id="editFillKm" class="form-input" step="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeFillModal()">Annuler</button>
                <button class="btn btn-primary" onclick="updateFill()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ================= DATA STORE =================
        const DB = {
            get(key, def) {
                try { return JSON.parse(localStorage.getItem(key)) || def; }
                catch { return def; }
            },
            set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
        };

        let vehicles = DB.get('vehicles', []);
        let fills = DB.get('fills', []);
        let selectedVehicle = null;
        let currentPhoto = null;
        let currentLocation = null;
        let currentAddress = null;
        let editingVehicleId = null;
        let editingFillId = null;
        let statsPeriod = 'month';
        let deferredPrompt = null;

        // ================= INIT =================
        function init() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            refreshLocation();
            renderVehicleSelector();
            renderHistory();
            renderStats();
            renderVehicles();
            renderFilters();

            ['volumeInput','priceInput'].forEach(id => {
                document.getElementById(id).addEventListener('input', calcTotal);
            });
            document.getElementById('totalInput').addEventListener('input', function() {
                const v = parseFloat(document.getElementById('volumeInput').value);
                const t = parseFloat(this.value);
                if(v && t) document.getElementById('priceInput').value = (t/v).toFixed(3);
            });

            // Edit fill listeners
            ['editFillVolume','editFillPrice'].forEach(id => {
                document.getElementById(id).addEventListener('input', calcEditTotal);
            });
            document.getElementById('editFillTotal').addEventListener('input', function() {
                const v = parseFloat(document.getElementById('editFillVolume').value);
                const t = parseFloat(this.value);
                if(v && t) document.getElementById('editFillPrice').value = (t/v).toFixed(3);
            });

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installBanner').classList.add('show');
            });
        }

        function calcTotal() {
            const v = parseFloat(document.getElementById('volumeInput').value);
            const p = parseFloat(document.getElementById('priceInput').value);
            if(v && p) document.getElementById('totalInput').value = (v * p).toFixed(2);
        }
        function calcEditTotal() {
            const v = parseFloat(document.getElementById('editFillVolume').value);
            const p = parseFloat(document.getElementById('editFillPrice').value);
            if(v && p) document.getElementById('editFillTotal').value = (v * p).toFixed(2);
        }

        // ================= NAVIGATION =================
        function showView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            event.target.classList.add('active');
            if(view === 'history') renderHistory();
            if(view === 'stats') renderStats();
            if(view === 'vehicles') renderVehicles();
        }

        async function refreshLocation() {
            const el = document.getElementById('autoLocation');
            const status = document.getElementById('locStatus');
            const addrEl = document.getElementById('addressDisplay');
            el.textContent = 'Recherche...';
            status.className = 'loc-status loading';
            status.textContent = 'Localisation en cours...';
            status.style.display = 'inline-block';
            addrEl.style.display = 'none';
            currentAddress = null;

            if(!navigator.geolocation) {
                el.textContent = 'Non disponible';
                status.className = 'loc-status error';
                status.textContent = 'Géolocalisation non supportée';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    el.textContent = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;

                    // Reverse geocoding via Nominatim
                    status.className = 'loc-status loading';
                    status.textContent = 'Recherche de l\'adresse...';
                    try {
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 8000);
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&zoom=18&addressdetails=1`,
                            { signal: controller.signal, headers: { 'Accept-Language': 'fr' } }
                        );
                        clearTimeout(timeout);
                        const data = await res.json();
                        if(data && data.display_name) {
                            currentAddress = data.display_name;
                            addrEl.textContent = '📍 ' + currentAddress;
                            addrEl.style.display = 'block';
                            status.className = 'loc-status success';
                            status.textContent = 'Adresse trouvée';
                        } else {
                            status.className = 'loc-status error';
                            status.textContent = 'Adresse non trouvée';
                        }
                    } catch(err) {
                        status.className = 'loc-status error';
                        status.textContent = 'Erreur de géocodage';
                    }
                },
                (err) => {
                    el.textContent = 'Position refusée';
                    status.className = 'loc-status error';
                    status.textContent = err.code === 1 ? 'Permission refusée' : 'Position indisponible';
                    currentLocation = null;
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
            );
        }

        // ================= PHOTO & OCR =================
        function handlePhoto(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                currentPhoto = ev.target.result;
                const area = document.getElementById('photoArea');
                area.innerHTML = `<img src="${currentPhoto}" alt="Compteur">`;
                area.classList.add('has-image');
                runOCR(currentPhoto);
            };
            reader.readAsDataURL(file);
        }

        async function runOCR(imageData) {
            const status = document.getElementById('ocrStatus');
            status.className = 'ocr-status loading';
            status.textContent = '🔍 Analyse de la photo en cours...';
            try {
                const result = await Tesseract.recognize(imageData, 'fra', {
                    logger: m => { if(m.status === 'recognizing text') status.textContent = `🔍 Analyse... ${Math.round(m.progress*100)}%`; }
                });
                const text = result.data.text;
                const numbers = text.match(/\d+[,.]?\d*/g) || [];

                let volume = null, price = null;
                const lines = text.split('\n');
                for(let line of lines) {
                    const lline = line.toLowerCase();
                    if((lline.includes('l') || lline.includes('litre')) && !volume) {
                        const m = line.match(/(\d+[,.]\d+)/);
                        if(m) volume = parseFloat(m[1].replace(',', '.'));
                    }
                    if((lline.includes('€') || lline.includes('eur') || lline.includes('prix')) && !price) {
                        const m = line.match(/(\d+[,.]\d{2,3})/);
                        if(m) price = parseFloat(m[1].replace(',', '.'));
                    }
                }

                if(!volume || !price) {
                    const decimals = numbers.filter(n => n.includes(',') || n.includes('.'))
                        .map(n => parseFloat(n.replace(',', '.')))
                        .filter(n => n > 0.5 && n < 200);
                    decimals.sort((a,b) => b-a);
                    if(!volume && decimals[0]) volume = decimals[0];
                    if(!price && decimals[1]) price = decimals[1];
                }

                if(volume) document.getElementById('volumeInput').value = volume;
                if(price) document.getElementById('priceInput').value = price;
                calcTotal();

                status.className = 'ocr-status success';
                status.textContent = volume || price 
                    ? `✅ Détecté: ${volume ? volume+'L' : ''} ${price ? price+'€/L' : ''}`
                    : '✅ Photo analysée (aucune valeur détectée)';
            } catch(err) {
                status.className = 'ocr-status error';
                status.textContent = '❌ Échec OCR - Saisie manuelle requise';
            }
        }

        function drawBarChart(canvasId, labels, values, label, color) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const w = rect.width, h = rect.height;

            ctx.clearRect(0, 0, w, h);
            if(!values.length) return;

            const max = Math.max(...values) * 1.1;
            const pad = { top: 30, right: 10, bottom: 40, left: 50 };
            const cw = w - pad.left - pad.right;
            const ch = h - pad.top - pad.bottom;
            const barW = Math.max(20, (cw / values.length) * 0.6);
            const gap = (cw - barW * values.length) / (values.length + 1);

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
            ctx.lineWidth = 1;
            for(let i=0; i<=4; i++) {
                const y = pad.top + ch - (ch/4)*i;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(w - pad.right, y);
                ctx.stroke();
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText((max/4*i).toFixed(0), pad.left - 8, y + 4);
            }

            values.forEach((v, i) => {
                const x = pad.left + gap + i * (barW + gap);
                const bh = (v / max) * ch;
                const y = pad.top + ch - bh;

                const grad = ctx.createLinearGradient(0, y, 0, y + bh);
                grad.addColorStop(0, color);
                grad.addColorStop(1, color + '80');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(x, y, barW, bh, 6);
                ctx.fill();

                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(v.toFixed(0), x + barW/2, y - 6);

                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
                ctx.font = '10px sans-serif';
                let lbl = labels[i];
                if(lbl.includes('-')) {
                    const [y,m] = lbl.split('-');
                    lbl = m + '/' + y;
                }
                ctx.fillText(lbl, x + barW/2, pad.top + ch + 18);
            });
        }

                const v = vehicles.find(x => x.id === f.vehicleId);
                const addr = f.address ? '"' + f.address.replace(/"/g, '""') + '"' : '';
                csv += `${f.date},${v?v.name:''},${f.volume},${f.pricePerLiter},${f.total},${f.km||''},${addr},${f.location?f.location.lat:''},${f.location?f.location.lng:''}\n`;
            });
            downloadFile(csv, 'fueltrack-export.csv', 'text/csv');
            showToast('Export CSV téléchargé');
        }

        function exportJSON() {
            const data = { vehicles, fills, exportedAt: new Date().toISOString() };
            downloadFile(JSON.stringify(data, null, 2), 'fueltrack-backup.json', 'application/json');
            showToast('Export JSON téléchargé');
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ================= UTILS =================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function installApp() {
            if(deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('installBanner').classList.remove('show');
                });
            }
        }

        // Close modals on overlay click
        document.getElementById('vehicleModal').addEventListener('click', e => {
            if(e.target === document.getElementById('vehicleModal')) closeVehicleModal();
        });
        document.getElementById('fillModal').addEventListener('click', e => {
            if(e.target === document.getElementById('fillModal')) closeFillModal();
        });

        // Init
        init();
    </script>
</body>
</html>
